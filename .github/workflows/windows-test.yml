name: Windows-Test bauen

on:
  push:
    branches: [main]
    paths: ["windows-test/**", ".github/workflows/windows-test.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Als Download bereitstellen (Release "windows-test")
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete windows-test --yes --cleanup-tag || true
          gh release create windows-test dist/MailTest-Windows.exe --title "Mail-Test Windows" --notes "Testprogramm: Mail mit Anhängen an eM Client" --target ${{ github.sha }}
