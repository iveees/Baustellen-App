name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK bauen
        run: gradle :app:assembleDebug --no-daemon
      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk MailTest.apk
      - name: Als Download bereitstellen (Release "test")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete test --yes --cleanup-tag || true
          gh release create test MailTest.apk --title "Mail-Test (neueste Version)" --notes "Auf dem Handy herunterladen und installieren." --target ${{ github.sha }}
