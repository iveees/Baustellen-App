name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Abhängigkeiten
        run: npm ci
      - name: Web-Teil in die Android-App kopieren
        run: npx cap sync android
      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Baustellen-Doku.apk
      - name: Als Download bereitstellen (Release "app")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app Baustellen-Doku.apk --title "Baustellen-Doku (neueste Version, Build ${{ github.run_number }})" --notes "Auf dem Handy herunterladen und installieren. Updates lassen sich einfach drüber installieren." --target ${{ github.sha }}
