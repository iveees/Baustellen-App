plugins { id 'com.android.application' }

android {
    namespace 'it.baustelle.mailtest'
    compileSdk 34
    defaultConfig {
        applicationId 'it.baustelle.mailtest'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
