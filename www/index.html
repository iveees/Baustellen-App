<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baustellen-Doku</title>
<style>
/* Eine Spalte fürs Handy, unten feste Navigation, Formulare als Blätter von unten */
:root {
  --bg: #eef0ee; --surface: #ffffff; --ink: #1d2428; --muted: #5d686e; --line: #d3d8d6;
  --accent: #e8a317; --accent-ink: #1d2428; --open: #b4471f; --done: #2f7a4f;
  --font: "Roboto Condensed", "Roboto", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15191b; --surface: #20262a; --ink: #e9ecea; --muted: #9aa5aa; --line: #343c40;
    --accent: #f0b232; --accent-ink: #15191b; --open: #ef8a5f; --done: #6cc28f; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); -webkit-tap-highlight-color: transparent;
  padding-top: env(safe-area-inset-top); }
h1, h2, h3 { margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 26px; } h2 { font-size: 20px; } h3 { font-size: 17px; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#app { max-width: 720px; margin: 0 auto; padding: 14px 14px 96px; display: grid; gap: 14px; }
.top { display: flex; align-items: center; gap: 10px; }
.top .grow { flex: 1; min-width: 0; }
.sub { color: var(--muted); font-size: 15px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 10px; }
.banner { background: var(--surface); border-left: 4px solid var(--open); padding: 10px 12px; border-radius: 6px; font-size: 15px; }
.banner.ok { border-left-color: var(--done); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; min-height: 46px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; justify-content: center; text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.big { min-height: 58px; font-size: 18px; width: 100%; }
.btn.danger { color: var(--open); }
.btn:disabled { opacity: .5; }
.iconbtn { width: 46px; height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; font-size: 20px; flex: none; text-decoration: none; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 6px; text-align: left; width: 100%; }
.card .title { font-weight: 600; font-size: 17px; }
.card.mitgriff { position: relative; padding-right: 64px; }
.griff { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: 1.5px solid var(--line); border-radius: 10px; display: grid; place-items: center; font-size: 22px; color: var(--muted, #6b7378); background: var(--surface); touch-action: none; cursor: grab; user-select: none; }
.card.zieht { position: relative; z-index: 5; box-shadow: 0 10px 28px rgba(0,0,0,.22); opacity: .96; transition: none; }
.card.zieht .griff { border-color: #e8a317; color: #e8a317; cursor: grabbing; }
.meta { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.pill.offen { color: var(--open); } .pill.erledigt { color: var(--done); } .pill.art { color: var(--muted); }
.count { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.thumbs { display: flex; gap: 6px; overflow-x: auto; }
.thumbs img, .thumbs .ph { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; background: var(--line); flex: none; }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 8px; min-height: 42px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; min-height: 38px; font-size: 15px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.group { display: grid; gap: 8px; }
.group > h3 { color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: .06em; margin-top: 6px; }
.contact { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.contact .head { display: flex; gap: 8px; align-items: flex-start; }
.contact .head .grow { flex: 1; min-width: 0; }
.contact .firma { font-weight: 600; overflow-wrap: anywhere; }
.links { display: grid; gap: 4px; font-size: 15px; }
.links a { text-decoration: none; overflow-wrap: anywhere; color: var(--ink); padding: 2px 0; }
.links a::before { content: attr(data-k); color: var(--muted); display: inline-block; width: 22px; font-weight: 600; }

label { font-weight: 600; font-size: 14px; color: var(--muted); display: grid; gap: 4px; }
input[type=text], input[type=search], input[type=date], input[type=tel], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; min-height: 46px; color: var(--ink); font-weight: 400; }
textarea { min-height: 110px; resize: vertical; }
.hint { font-size: 14px; color: var(--muted); }

nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr); z-index: 5; padding-bottom: env(safe-area-inset-bottom); }
nav.bottom a { text-align: center; padding: 13px 4px 15px; text-decoration: none; font-weight: 600; color: var(--muted); font-size: 15px; }
nav.bottom a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 3px 0 var(--accent); }

#sheet { position: fixed; inset: 0; z-index: 10; display: none; }
#sheet.open { display: block; }
#sheet .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
#sheet .panel { position: absolute; left: 0; right: 0; bottom: 0; top: max(24px, env(safe-area-inset-top)); overflow-y: auto; background: var(--surface); border-radius: 16px 16px 0 0; padding: 14px 14px 32px; display: grid; gap: 14px; align-content: start; max-width: 720px; margin: 0 auto; }
.panel .bar { display: flex; align-items: center; gap: 8px; position: sticky; top: -14px; background: var(--surface); padding: 8px 0; z-index: 1; }
.panel .bar h2 { flex: 1; }

.mic { width: 100%; min-height: 76px; border-radius: 14px; border: 2px solid var(--ink); background: var(--surface); font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }
.mic .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--open); }
.mic.on { background: var(--open); color: #fff; border-color: var(--open); }
.mic.on .dot { background: #fff; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.partial { color: var(--muted); font-style: italic; min-height: 1.3em; font-size: 15px; }
.punkt { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 4px; background: var(--bg); text-align: left; width: 100%; }
.punkt.aktuell { border: 2px solid var(--accent); background: var(--surface); }
.punkt .nr { font-weight: 700; }
[data-lp] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.photo { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--line); }
.photo img { width: 100%; height: 100%; object-fit: cover; }
.photo button { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 16px; }
.box { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 20; font-weight: 600; max-width: 90%; text-align: center; }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; }
.pick { display: flex; gap: 10px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); color: var(--ink); font-weight: 400; font-size: 16px; }
.pick input { width: 24px; height: 24px; flex: none; }
.folder { display: flex; gap: 10px; align-items: center; padding: 14px 6px; border: 0; border-bottom: 1px solid var(--line); background: transparent; width: 100%; text-align: left; font-size: 16px; }
.folder::before { content: "📁"; }
.syncbar { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.syncbar .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--done); flex: none; }
.syncbar .dot.warn { background: var(--accent); } .syncbar .dot.err { background: var(--open); }
</style>
</head>
<body>
<div id="app"></div>
<nav class="bottom" id="nav">
  <a href="#start" data-nav="start">Baustellen</a>
  <a href="#adressbuch" data-nav="adressbuch">Adressbuch</a>
  <a href="#einstellungen" data-nav="einstellungen">Einstellungen</a>
</nav>
<div id="sheet"><div class="backdrop" data-act="close-sheet"></div><div class="panel" id="panel"></div></div>

<script src="lib/capacitor.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jspdf.plugin.autotable.min.js"></script>
<script src="lib/docx.iife.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="config.js"></script>
<script src="kontakte-start.js"></script>
<script src="dropbox.js"></script>
<script src="app.js"></script>
</body>
</html>
